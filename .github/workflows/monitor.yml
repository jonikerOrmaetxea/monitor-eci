name: Vigilante Apple ECI

on:
  schedule:
    - cron: '*/5 * * * *' # Mínimo permitido por GitHub: cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar navegador Playwright y librerías
        run: |
          pip install playwright playwright-stealth
          playwright install --with-deps chromium

      - name: Ejecutar el bot
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py

      - name: Guardar lista de productos vistos
        run: |
          git config --global user.name 'Bot Vigilante'
          git config --global user.email 'bot@noreply.github.com'
          git add vistos.json || true
          git diff --staged --quiet || (git commit -m "Actualizar catálogo visto" && git push)
